[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -m "not live_remote"
markers =
    live_remote: opt-in test that calls the real Anthropic API (needs YUU_REMOTE_AI=1 + ANTHROPIC_API_KEY). Excluded from default runs; select with `pytest -m live_remote`.
    integration: needs the seeded project DB / TestClient (tests/integration).
    ui: needs a live server on the test URL (tests/ui).
    environment: depends on real installed packages, HF cache, or OS state.
