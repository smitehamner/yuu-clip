<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rp-clipper</title>
<style>
  :root {
    --bg:       #0f0f11;
    --surface:  #1a1a1f;
    --border:   #2a2a33;
    --text:     #e8e8f0;
    --muted:    #6b6b80;
    --accent:   #7c6af7;
    --accent2:  #4fc3f7;
    --green:    #4caf7d;
    --red:      #e05c5c;
    --yellow:   #f0c060;
    --funny:    #f7a85a;
    --dramatic: #b06af7;
    --action:   #4fc3f7;
    --overall:  #7c6af7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; font-size: 14px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── header ── */
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: .5px; color: var(--accent); }

  /* job status pill */
  .job-status { display: none; align-items: center; gap: 8px; background: #1e1e2a; border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px 4px 8px; font-size: 12px; color: var(--text); margin-right: auto; }
  .job-status.visible { display: flex; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .job-steps { display: flex; gap: 6px; align-items: center; }
  .step { font-size: 11px; padding: 2px 7px; border-radius: 10px; background: var(--border); color: var(--muted); transition: background .2s, color .2s; }
  .step.active { background: var(--accent); color: #fff; }
  .step.done   { background: var(--green);  color: #fff; }
  .header-spacer { margin-right: auto; }

  /* ── buttons ── */
  .btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; transition: background .15s, opacity .15s; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover:not(:disabled) { background: var(--border); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { opacity: .85; background: var(--accent); }
  /* Ghost: de-emphasised, for utility actions like log export */
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); font-size: 12px; padding: 6px 10px; }
  .btn.ghost:hover:not(:disabled) { background: var(--border); color: var(--text); }
  /* Primary review actions — larger targets (Fitts's Law) */
  .btn.approve { background: var(--green); border-color: var(--green); color: #fff; padding: 9px 22px; font-size: 14px; font-weight: 600; }
  .btn.approve:hover:not(:disabled) { opacity: .85; }
  .btn.reject  { background: var(--red);   border-color: var(--red);   color: #fff; padding: 9px 22px; font-size: 14px; font-weight: 600; }
  .btn.reject:hover:not(:disabled)  { opacity: .85; }
  .btn.active  { outline: 2px solid #fff; outline-offset: 1px; }

  /* ── toast notifications ── */
  .toast-container { position: fixed; top: 52px; right: 16px; z-index: 400; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; font-size: 13px; box-shadow: 0 4px 20px rgba(0,0,0,.5); animation: toastIn .2s ease; pointer-events: all; max-width: 320px; line-height: 1.4; }
  .toast.success { border-left: 3px solid var(--green); }
  .toast.error   { border-left: 3px solid var(--red); }
  .toast.info    { border-left: 3px solid var(--accent); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }

  /* ── main layout ── */
  .layout { display: flex; flex: 1; overflow: hidden; }

  /* ── sidebar ── */
  .sidebar { width: 240px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-section { padding: 10px 12px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .sidebar-list { list-style: none; overflow-y: auto; }
  .sidebar-list li { padding: 8px 14px; cursor: pointer; border-left: 3px solid transparent; transition: background .1s; }
  .sidebar-list li:hover { background: var(--border); }
  .sidebar-list li.active { border-left-color: var(--accent); background: #1f1f2a; }
  .video-item .name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .video-item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .clip-item { display: flex; align-items: center; gap: 8px; }
  .clip-item .score-badge { font-size: 11px; font-weight: 700; color: var(--overall); width: 36px; flex-shrink: 0; }
  .clip-item .clip-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .clip-item .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-approved { background: var(--green); }
  .dot-rejected { background: var(--red); }
  .dot-pending  { background: var(--muted); }
  .sidebar-divider { height: 1px; background: var(--border); margin: 4px 0; }
  .clip-miniscores { display: flex; gap: 4px; padding: 3px 0 0 44px; }
  .mini-bar-wrap { flex: 1; display: flex; align-items: center; gap: 3px; }
  .mini-bar-label { font-size: 9px; color: var(--muted); width: 10px; flex-shrink: 0; }
  .mini-bar-bg { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .mini-bar { height: 100%; border-radius: 2px; }

  /* ── main panel ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ── player area ── */
  .player-area { background: #000; position: relative; flex-shrink: 0; }
  .player-area video { display: block; width: 100%; max-height: 42vh; object-fit: contain; }
  .no-export-msg { padding: 48px; text-align: center; color: var(--muted); }
  .no-export-msg .btn { margin-top: 12px; }

  /* ── detail panel ── */
  .detail { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .detail-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); }

  /* ── empty state (first-run / no videos) ── */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 14px; color: var(--muted); text-align: center; padding: 40px; }
  .empty-state h2 { font-size: 20px; font-weight: 600; color: var(--text); }
  .empty-state p  { font-size: 14px; line-height: 1.65; max-width: 340px; }

  .clip-header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .clip-header h2 { font-size: 17px; font-weight: 600; }
  .clip-header .time { color: var(--muted); font-size: 13px; }
  .description { font-style: italic; color: var(--accent2); font-size: 14px; line-height: 1.5; }

  /* score bars */
  .scores { display: grid; grid-template-columns: 90px 1fr 38px; gap: 5px 10px; align-items: center; }
  .score-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .score-bar-wrap { background: var(--border); border-radius: 3px; height: 8px; overflow: hidden; }
  .score-bar { height: 100%; border-radius: 3px; transition: width .4s; }
  .bar-overall  { background: var(--overall); }
  .bar-funny    { background: var(--funny); }
  .bar-dramatic { background: var(--dramatic); }
  .bar-action   { background: var(--action); }
  .score-val { font-size: 12px; font-weight: 600; text-align: right; }

  /* actions */
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* tags */
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { padding: 2px 8px; border-radius: 10px; background: var(--border); font-size: 11px; color: var(--muted); }

  /* transcript */
  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .transcript { font-size: 13px; line-height: 1.7; color: #c0c0d0; white-space: pre-wrap; max-height: 160px; overflow-y: auto; background: var(--surface); padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border); }

  /* ── progress log ── */
  .log-panel { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 8px 14px; max-height: 180px; overflow-y: auto; font-family: monospace; font-size: 12px; color: var(--text); display: none; z-index: 100; }
  .log-panel.visible { display: block; }
  .log-line { white-space: pre; padding: 1px 0; }
  .log-line.ok  { color: var(--green); }
  .log-line.err { color: var(--red); }
  .log-line.warn { color: var(--yellow); }
  .log-close { position: sticky; top: 0; float: right; cursor: pointer; color: var(--muted); font-size: 16px; background: var(--surface); padding: 0 4px; }

  /* ── modals ── */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; align-items: center; justify-content: center; }
  .modal-bg.visible { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 500px; display: flex; flex-direction: column; gap: 14px; }
  .modal h3 { font-size: 16px; font-weight: 600; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select { width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; }
  .path-row { display: flex; gap: 6px; }
  .path-row input { flex: 1; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* advanced options disclosure in ingest modal */
  details.advanced { border: 1px solid var(--border); border-radius: 6px; }
  details.advanced > summary { padding: 8px 12px; cursor: pointer; font-size: 12px; color: var(--muted); user-select: none; list-style: none; display: flex; align-items: center; gap: 6px; }
  details.advanced > summary::before { content: '▶'; font-size: 9px; transition: transform .15s; }
  details.advanced[open] > summary::before { transform: rotate(90deg); }
  details.advanced .field { padding: 10px 12px 4px; }
  details.advanced .field:last-child { padding-bottom: 12px; }

  /* time estimate table */
  .estimate-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-size: 12px; }
  .estimate-box .probe-info { color: var(--muted); margin-bottom: 8px; }
  .estimate-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-radius: 4px; }
  .estimate-row.warn { background: rgba(240,96,60,.08); margin: 0 -4px; padding: 3px 4px; }
  .estimate-step { flex: 1; color: var(--text); }
  .estimate-note { color: var(--muted); font-size: 11px; }
  .estimate-time { font-weight: 700; min-width: 48px; text-align: right; }
  .warn-icon { font-size: 13px; flex-shrink: 0; }
  .t-fast   { color: var(--green); }
  .t-medium { color: var(--yellow); }
  .t-warn   { color: #f0603c; }
  .estimate-total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .total-warn-badge { font-size: 11px; background: rgba(240,96,60,.15); border: 1px solid #f0603c; color: #f0603c; border-radius: 4px; padding: 2px 8px; font-weight: 500; }
  .estimate-threshold { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; color: var(--muted); font-size: 11px; }
  .estimate-threshold input { width: 48px; padding: 2px 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 11px; text-align: center; }
  .probing-spinner { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>rp-clipper</h1>
  <div class="job-status" id="job-status">
    <div class="spinner"></div>
    <div class="job-steps" id="job-steps"></div>
  </div>
  <div class="header-spacer" id="header-spacer"></div>
  <button class="btn primary" id="btn-ingest" onclick="openIngestModal()">+ Ingest</button>
  <button class="btn" id="btn-score" onclick="scoreAll()">Score All</button>
  <button class="btn" id="btn-demo" onclick="openDemoModal()">Build Reel</button>
  <a class="btn ghost" id="btn-logs" href="/api/logs/export" download="rp-clipper.log"
     title="Download debug log — attach when reporting a bug">&#8595; Log</a>
</header>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">Videos</div>
    <ul class="sidebar-list" id="video-list"></ul>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">Clips</div>
    <ul class="sidebar-list" id="clip-list"></ul>
  </div>

  <!-- Main panel -->
  <div class="main">
    <div class="player-area" id="player-area"></div>
    <div class="detail" id="detail">
      <div class="detail-empty">Select a clip from the sidebar</div>
    </div>
  </div>
</div>

<!-- Progress log -->
<div class="log-panel" id="log-panel">
  <span class="log-close" onclick="closeLog()">&#x2715;</span>
  <div id="log-lines"></div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<!-- Ingest modal -->
<div class="modal-bg" id="ingest-modal">
  <div class="modal">
    <h3>Ingest Video</h3>
    <div class="field">
      <label>Video file path</label>
      <div class="path-row">
        <input type="text" id="ingest-path" placeholder="D:\recordings\session.mkv" oninput="scheduleProbe()">
        <button class="btn" onclick="pickFile()" title="Browse for file">&#128193;</button>
      </div>
    </div>
    <div class="field">
      <label>Track profile</label>
      <div style="display:flex;gap:6px">
        <select id="ingest-profile" style="flex:1"></select>
        <button class="btn" onclick="openProfileManager()" title="Manage profiles">&#9881;</button>
      </div>
    </div>
    <details class="advanced">
      <summary>Advanced options</summary>
      <div class="field">
        <label>Whisper model</label>
        <select id="ingest-model" onchange="runEstimate()">
          <option value="tiny">tiny — fastest, lowest quality</option>
          <option value="base">base — very fast, lower quality</option>
          <option value="small">small — fast (~500 MB VRAM)</option>
          <option value="medium" selected>medium — good balance (~1.5 GB VRAM)</option>
          <option value="large-v3">large-v3 — best quality (~3 GB VRAM)</option>
        </select>
      </div>
      <div class="field">
        <label>Scene detection</label>
        <select id="ingest-scene-mode" onchange="runEstimate()">
          <option value="transcript">Transcript only — silence gaps, instant</option>
          <option value="fast" selected>Fast — keyframes + transcript gaps (recommended)</option>
          <option value="full">Full — every frame, most accurate (slow)</option>
        </select>
      </div>
    </details>
    <div id="estimate-area"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeIngestModal()">Cancel</button>
      <button class="btn primary" id="btn-start-ingest" onclick="startIngest()">Start Ingest</button>
    </div>
  </div>
</div>

<!-- Profile Manager Modal -->
<div class="modal-bg" id="profile-modal">
  <div class="modal" style="width:560px;max-height:80vh;overflow-y:auto">
    <h3>Track Profiles</h3>
    <div id="profile-list"></div>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button class="btn primary" onclick="openNewProfile()">+ New Profile</button>
      <button class="btn" style="margin-left:auto" onclick="closeProfileManager()">Close</button>
    </div>
    <div id="profile-editor" style="display:none;border-top:1px solid var(--border);margin-top:14px;padding-top:14px">
      <div class="field">
        <label>Profile name</label>
        <input type="text" id="pe-name" placeholder="my_obs_setup">
      </div>
      <div class="field">
        <label>Number of tracks</label>
        <input type="number" id="pe-numtracks" min="1" max="8" value="2" oninput="renderTrackRows()">
      </div>
      <div id="pe-tracks"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn primary" onclick="saveProfile()">Save</button>
        <button class="btn" onclick="cancelProfileEdit()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- Demo Reel Modal -->
<div class="modal-bg" id="demo-modal">
  <div class="modal">
    <h3>Build Highlight Reel</h3>
    <div class="field">
      <label>Clips to include</label>
      <select id="demo-video-id">
        <option value="">All approved clips</option>
      </select>
    </div>
    <div class="field">
      <label>Transition</label>
      <select id="demo-transition">
        <option value="fade" selected>Fade</option>
        <option value="dissolve">Dissolve</option>
        <option value="wipeleft">Wipe left</option>
        <option value="wiperight">Wipe right</option>
        <option value="slideleft">Slide left</option>
        <option value="slideright">Slide right</option>
        <option value="none">None (hard cut)</option>
      </select>
    </div>
    <div style="display:flex;gap:12px">
      <div class="field" style="flex:1">
        <label>Transition duration (s)</label>
        <input type="number" id="demo-trans-dur" value="0.5" min="0.1" max="2.0" step="0.1">
      </div>
      <div class="field" style="flex:1">
        <label>Title card duration (s)</label>
        <input type="number" id="demo-title-dur" value="3.0" min="1.0" max="10.0" step="0.5">
      </div>
    </div>
    <div class="field">
      <label>Output filename</label>
      <input type="text" id="demo-output-name" value="highlights.mkv">
    </div>
    <div id="demo-status" style="font-size:12px;color:var(--muted)"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeDemoModal()">Cancel</button>
      <button class="btn primary" onclick="startDemo()">Build Reel</button>
    </div>
  </div>
</div>

<!-- Retranscribe Modal -->
<div class="modal-bg" id="retranscribe-modal">
  <div class="modal" style="width:360px">
    <h3>Retranscribe Clip</h3>
    <div class="field">
      <label>Whisper model</label>
      <select id="retranscribe-model">
        <option value="tiny">tiny</option>
        <option value="base">base</option>
        <option value="small">small</option>
        <option value="medium">medium</option>
        <option value="large-v3" selected>large-v3 (best quality)</option>
      </select>
    </div>
    <div style="font-size:12px;color:var(--muted)">
      Transcribes only this clip's time window with the selected model, then re-scores.
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeRetranscribeModal()">Cancel</button>
      <button class="btn primary" onclick="startRetranscribe()">Retranscribe</button>
    </div>
  </div>
</div>

<script>
// ── state ─────────────────────────────────────────────────────────────────────
let activeVideoId = null;
let activeClipId  = null;
let _videos       = [];

// ── boot ──────────────────────────────────────────────────────────────────────
loadVideos();

// ── videos ────────────────────────────────────────────────────────────────────
async function loadVideos() {
  const res    = await fetch('/api/videos');
  const videos = await res.json();
  _videos = videos;

  const list = document.getElementById('video-list');
  list.innerHTML = '';

  if (!videos.length) {
    list.innerHTML = '<li style="padding:10px 14px;color:var(--muted)">No videos yet</li>';
    _showEmptyState();
    _updateDemoButton(0);
    return;
  }

  for (const v of videos) {
    const li = document.createElement('li');
    li.className = 'video-item' + (v.id === activeVideoId ? ' active' : '');
    li.innerHTML = `
      <div class="name" title="${v.filename}">${v.filename}</div>
      <div class="meta">${v.duration_hms} &middot; ${v.clip_count} clips (${v.approved} approved) &middot; ${v.status}</div>`;
    li.onclick = () => {
      document.querySelectorAll('#video-list li').forEach(l => l.classList.remove('active'));
      li.classList.add('active');
      selectVideo(v.id);
    };
    list.appendChild(li);
  }

  const totalApproved = videos.reduce((n, v) => n + v.approved, 0);
  _updateDemoButton(totalApproved);
}

function _showEmptyState() {
  document.getElementById('player-area').innerHTML = '';
  document.getElementById('detail').innerHTML = `
    <div class="empty-state">
      <h2>Welcome to rp-clipper</h2>
      <p>Ingest a video recording to start reviewing and exporting your best gaming moments.</p>
      <button class="btn primary" onclick="openIngestModal()">+ Ingest your first video</button>
    </div>`;
}

function _updateDemoButton(approvedCount) {
  const btn = document.getElementById('btn-demo');
  btn.disabled = approvedCount === 0;
  btn.title = approvedCount === 0
    ? 'Approve some clips first to build a reel'
    : `Build a highlight reel from ${approvedCount} approved clip(s)`;
}

async function selectVideo(id) {
  activeVideoId = id;
  activeClipId  = null;
  const res   = await fetch(`/api/videos/${id}/clips`);
  const clips = await res.json();
  renderClipList(clips);
  clearDetail();
}

// ── clips ─────────────────────────────────────────────────────────────────────
function renderClipList(clips) {
  const list = document.getElementById('clip-list');
  list.innerHTML = '';
  if (!clips.length) {
    list.innerHTML = '<li style="padding:10px 14px;color:var(--muted)">No clips</li>';
    return;
  }
  for (const c of clips) {
    const li = document.createElement('li');
    li.className = c.id === activeClipId ? 'active' : '';
    li.innerHTML = `
      <div class="clip-item">
        <span class="score-badge">${c.score_overall.toFixed(2)}</span>
        <span class="clip-label" title="${c.description || ''}">
          <span style="color:var(--muted);font-size:11px">#${c.id}</span>
          ${c.start_hms} &middot; ${c.duration_hms}
        </span>
        <span class="status-dot dot-${c.status}" title="${c.status}"></span>
      </div>

        ${miniBar('F', 'Funny',    c.score_funny,    'var(--funny)')}

      document.querySelectorAll('#clip-list li').forEach(l => l.classList.remove('active'));

let _probeTimer = null;
let _probedInfo  = null;

async function openIngestModal() {
  document.getElementById('ingest-modal').classList.add('visible');
  document.getElementById('estimate-area').innerHTML = '';
  _probedInfo = null;
  await _loadProfileDropdown();
}

async function _loadProfileDropdown() {
  const sel = document.getElementById('ingest-profile');
  try {
    const profiles = await fetch('/api/profiles').then(r => r.json());
    sel.innerHTML = profiles.map(p =>
      `<option value="${p.name}">${escHtml(p.display_name)}</option>`
    ).join('');
  } catch { /* leave dropdown empty; ingest still works with auto-labeling */ }
}

function closeIngestModal() {
  document.getElementById('ingest-modal').classList.remove('visible');
  clearTimeout(_probeTimer);
}

function scheduleProbe() {
  clearTimeout(_probeTimer);
  const path = document.getElementById('ingest-path').value.trim();
  if (!path) { document.getElementById('estimate-area').innerHTML = ''; return; }
  document.getElementById('estimate-area').innerHTML = '<div class="probing-spinner">Probing file...</div>';
  _probeTimer = setTimeout(() => runProbe(path), 700);
}

async function runProbe(path) {
  try {
    const res = await fetch('/api/probe', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body:   JSON.stringify({path}),
    });
    if (!res.ok) {
      const err = await res.json();
      const msg = typeof err.detail === 'string' ? err.detail : JSON.stringify(err.detail);
      document.getElementById('estimate-area').innerHTML =
        `<div style="color:var(--red);font-size:12px">${escHtml(msg)}</div>`;
      return;
    }
    _probedInfo = await res.json();
    runEstimate();
  } catch (err) {
    document.getElementById('estimate-area').innerHTML =
      `<div style="color:var(--red);font-size:12px">Could not probe file: ${escHtml(String(err.message || err))}</div>`;
  }
}

async function runEstimate() {
  if (!_probedInfo) return;
  try {
    const res = await fetch('/api/estimate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body:   JSON.stringify({
        duration_s:   _probedInfo.duration_s,
        model:        document.getElementById('ingest-model').value,
        audio_tracks: _probedInfo.audio_tracks,
        has_gpu:      true,
        scene_mode:   document.getElementById('ingest-scene-mode').value,
      }),
    });
    if (!res.ok) return;
    renderEstimate(_probedInfo, await res.json());
  } catch { /* ignore; estimate is non-critical */ }
}

let _warnThresholdMin = 30;

function renderEstimate(info, data) {
  const warnS = _warnThresholdMin * 60;
  const tClass = s => s >= warnS ? 't-warn' : s >= warnS / 3 ? 't-medium' : 't-fast';

  const rows = data.steps.map(s => {
    const isWarn = s.seconds >= warnS;
    return `
      <div class="estimate-row${isWarn ? ' warn' : ''}">
        <span class="warn-icon">${isWarn ? '&#9888;' : ''}</span>
        <span class="estimate-step">${s.name}</span>
        <span class="estimate-note">${s.note}</span>
        <span class="estimate-time ${tClass(s.seconds)}">${s.hms}</span>
      </div>`;
  }).join('');

  const totalWarn  = data.total_seconds >= warnS;
  const totalBadge = totalWarn ? `<span class="total-warn-badge">&#9888; Long job</span>` : '';

  document.getElementById('estimate-area').innerHTML = `
    <div class="estimate-box">
      <div class="probe-info">
        ${escHtml(info.filename)} &middot; ${info.duration_hms} &middot;
        ${info.width}&#x2715;${info.height} @ ${info.fps.toFixed(0)}fps &middot;
        ${info.audio_tracks} audio track(s)
      </div>
      <div class="estimate-threshold">
        Warn steps longer than
        <input type="number" min="1" max="480" value="${_warnThresholdMin}" id="warn-threshold-input"
               onchange="_warnThresholdMin=+this.value; runEstimate()"> min
      </div>
      ${rows}
      <div class="estimate-total">
        <span>Total estimated</span>
        <span style="display:flex;align-items:center;gap:8px">
          ${totalBadge}
          <span class="${tClass(data.total_seconds)}">${data.total_hms}</span>
        </span>
      </div>
    </div>`;
}

async function startIngest() {

  {label: 'Transcribe', patterns: ['Transcribing']},
  {label: 'Candidates', patterns: ['Generating clip']},
  {label: 'Energy',     patterns: ['Computing audio energy']},

];

let _jobStepDefs = [];

function startJobUI(stepDefs, jobLabel) {
  _jobStepDefs = stepDefs;
  document.getElementById('job-steps').innerHTML =
    `<span style="color:var(--muted);margin-right:4px">${jobLabel}</span>` +
    stepDefs.map((s, i) => `<span class="step" id="step-${i}">${s.label}</span>`).join('');
  document.getElementById('job-status').classList.add('visible');
  document.getElementById('header-spacer').style.display = 'none';
  document.querySelectorAll('#btn-ingest,#btn-score,#btn-demo').forEach(b => b.disabled = true);
}

function updateJobUI(line) {
  _jobStepDefs.forEach((s, i) => {
    if (s.patterns.some(p => line.includes(p))) {
      for (let j = 0; j < i; j++) {
        const el = document.getElementById(`step-${j}`);
        if (el) el.className = 'step done';
      }
      const el = document.getElementById(`step-${i}`);
      if (el) el.className = 'step active';
    }
  });
}

function endJobUI() {
  _jobStepDefs.forEach((_, i) => {
    const el = document.getElementById(`step-${i}`);
    if (el) el.className = 'step done';
  });
  setTimeout(() => {
    document.getElementById('job-status').classList.remove('visible');
    document.getElementById('header-spacer').style.display = '';
    // btn-demo re-enabled by loadVideos() which checks approved count
    document.querySelectorAll('#btn-ingest,#btn-score').forEach(b => b.disabled = false);
  }, 2000);
}

// ── SSE helper ─────────────────────────────────────────────────────────────────
function streamSSE(url, onDone, stepDefs, jobLabel) {
  if (stepDefs) startJobUI(stepDefs, jobLabel);
  const es = new EventSource(url);
  es.onmessage = e => {
    const text = JSON.parse(e.data);
    if (text === '__DONE__') {
      es.close();
      if (stepDefs) endJobUI();
      if (onDone) onDone();
      return;
    }
    appendLog(text);
    if (stepDefs) updateJobUI(text);
  };
  es.onerror = () => {
    es.close();
    appendLog('[connection closed]');
    if (stepDefs) endJobUI();
  };
}

// ── log panel ──────────────────────────────────────────────────────────────────
function openLog()  { document.getElementById('log-panel').classList.add('visible'); }
function closeLog() { document.getElementById('log-panel').classList.remove('visible'); }

function appendLog(raw) {
  const text = stripRichMarkup(raw);
  if (!text.trim()) return;
  const div = document.createElement('div');
  // Detect line intent from the raw text (before markup was stripped)
  const isOk   = raw.includes(' OK') || raw.includes('[green]') || raw.includes('Done');
  const isErr   = raw.includes('FAIL') || raw.includes('Error') || raw.includes('[red]') || raw.includes('error');
  const isWarn  = raw.includes('[yellow]') || raw.includes('WARNING') || raw.includes('overlap');
  div.className = 'log-line' + (isOk ? ' ok' : isErr ? ' err' : isWarn ? ' warn' : '');
  div.textContent = text;
  const lines = document.getElementById('log-lines');
  lines.appendChild(div);
  lines.scrollTop = lines.scrollHeight;
}

// ── toast notifications ────────────────────────────────────────────────────────
function showToast(message, type = 'success', durationMs = 4000) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.transition = 'opacity .3s';
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, durationMs);
}

// ── utils ──────────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function stripRichMarkup(text) {
  return text
    .replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '')  // ANSI escape codes (\e[1m, \e[0m, etc.)
    .replace(/\[\/?\w+\]/g, '');              // Rich markup tags: [bold], [/bold], [red], [dim], etc.
}

function miniBar(abbr, fullName, val, color) {
  return `<div class="mini-bar-wrap" title="${fullName}: ${(val * 100).toFixed(0)}%">
    <span class="mini-bar-label">${abbr}</span>
    <div class="mini-bar-bg"><div class="mini-bar" style="width:${(val*100).toFixed(1)}%;background:${color}"></div></div>
  </div>`;
}

const TRACK_LABELS = ['player_voice', 'ingame_voicechat', 'game_sounds', 'combined', 'unlabeled'];
let _allProfiles = [];

async function openProfileManager() {

async function _refreshProfileList() {
  _allProfiles = await fetch('/api/profiles').then(r => r.json());

  if (!_allProfiles.length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:13px">No profiles saved.</div>';
    return;
  }
  el.innerHTML = _allProfiles.map(p => `
    <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
      <span style="flex:1;font-size:13px">${p.builtin ? '&#128274; ' : ''}${escHtml(p.display_name)}</span>
      <span style="color:var(--muted);font-size:12px">${p.num_tracks} track${p.num_tracks !== 1 ? 's' : ''}</span>
      ${!p.builtin ? `
        <button class="btn" style="padding:4px 10px;font-size:12px" data-delete-profile="${escHtml(p.name)}"
                onclick="editProfile(${JSON.stringify(p.name)})">Edit</button>
        <button class="btn" style="padding:4px 10px;font-size:12px;color:var(--red)"

function openNewProfile() {
  document.getElementById('profile-editor').style.display = '';
  document.getElementById('pe-name').value = '';
  document.getElementById('pe-numtracks').value = 2;
  renderTrackRows();
}

function editProfile(name) {
  const p = _allProfiles.find(x => x.name === name);
  if (!p) return;
  document.getElementById('profile-editor').style.display = '';
  document.getElementById('pe-name').value     = p.name;
  document.getElementById('pe-numtracks').value = p.num_tracks;
  renderTrackRows(p.assignments);
}

function renderTrackRows(existingAssignments) {
  const n   = parseInt(document.getElementById('pe-numtracks').value) || 1;
  const rows = [];
  for (let i = 0; i < n; i++) {
    const a     = existingAssignments?.[i] ?? null;
    const label = a ? a.label : (i === 0 ? 'combined' : 'unlabeled');
    const doTx  = a ? (a.do_transcribe !== false) : (label !== 'game_sounds');
    const doSc  = a ? (a.do_score !== false)      : (label !== 'game_sounds');
    const opts  = TRACK_LABELS.map(l =>
      `<option value="${l}"${l === label ? ' selected' : ''}>${l}</option>`
    ).join('');
    rows.push(`
      <div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px">
        <span style="color:var(--muted);width:60px;flex-shrink:0">Track ${i}</span>
        <select id="pe-label-${i}" onchange="onLabelChange(${i})"
                style="flex:1;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px">${opts}</select>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap">
          <input type="checkbox" id="pe-tx-${i}" ${doTx ? 'checked' : ''}> Transcribe
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap">
          <input type="checkbox" id="pe-sc-${i}" ${doSc ? 'checked' : ''}> Score
        </label>
      </div>`);
  }
  document.getElementById('pe-tracks').innerHTML = rows.join('');
}

function onLabelChange(i) {
  const isGameSound = document.getElementById(`pe-label-${i}`).value === 'game_sounds';
  document.getElementById(`pe-tx-${i}`).checked = !isGameSound;
  document.getElementById(`pe-sc-${i}`).checked = !isGameSound;
}

async function saveProfile() {
  const name = document.getElementById('pe-name').value.trim();
  if (!name)                { showToast('Profile name is required', 'error'); return; }
  if (name.startsWith('__')) { showToast('Profile name cannot start with __', 'error'); return; }
  const n = parseInt(document.getElementById('pe-numtracks').value) || 1;
  const assignments = Array.from({length: n}, (_, i) => ({
    stream_position: i,
    label:           document.getElementById(`pe-label-${i}`).value,
    do_transcribe:   document.getElementById(`pe-tx-${i}`).checked,
    do_score:        document.getElementById(`pe-sc-${i}`).checked,
  }));
  const res = await fetch('/api/profiles', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body:   JSON.stringify({name, assignments}),
  });
  if (!res.ok) {
    const e = await res.json();
    showToast(e.detail || 'Save failed', 'error');
    return;
  }
  document.getElementById('profile-editor').style.display = 'none';
  await _refreshProfileList();
  showToast(`Profile "${name}" saved`);
}

async function deleteProfile(name) {
  if (!confirm(`Delete profile "${name}"?`)) return;
  await fetch(`/api/profiles/${encodeURIComponent(name)}`, {method: 'DELETE'});
  await _refreshProfileList();
  showToast(`Profile "${name}" deleted`);
}

}

function closeRetranscribeModal() {
  document.getElementById('retranscribe-modal').classList.remove('visible');
}

function startRetranscribe() {
  if (!_retranscribeClipId) return;
  const model = document.getElementById('retranscribe-model').value;
  closeRetranscribeModal();
  openLog();
  streamSSE(
    `/api/clips/${_retranscribeClipId}/retranscribe?model=${encodeURIComponent(model)}`,
    () => { selectClip(_retranscribeClipId); showToast('Retranscription complete'); },
    [{label: 'Transcribe', patterns: ['Retranscribing', 'OK']}, {label: 'Score', patterns: ['Re-scoring']}],
    'Retranscribing',
  );
}
</script>
</body>
</html>
