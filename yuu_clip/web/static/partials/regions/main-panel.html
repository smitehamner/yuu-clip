  <div class="main">
    <div class="player-area" id="player-area"></div>
    <div class="resize-handle resize-handle-v" id="player-resize-handle" title="Drag to resize player" role="separator" aria-orientation="horizontal" aria-label="Resize player"></div>
    <div class="detail" id="detail">
      <div class="detail-empty">Select a recording on the left</div>
    </div>

    <!-- New Recording panel - replaces player+detail when active -->
    <div class="new-recording-panel" id="new-recording-panel" style="display:none">
      <div class="new-recording-inner">
        <div class="new-recording-header">
          <h2 id="new-recording-title">New Recording</h2>
          <button class="btn ghost" id="btn-close-new-recording"
                  aria-label="Close" style="font-size:16px">&#x2715;</button>
        </div>

        <div id="reanalyze-warning" class="reanalyze-warning" style="display:none"></div>

        <div class="field" id="recording-source-field">
          <label for="analyze-path">Recording file</label>
          <div class="path-row">
            <button class="btn" id="btn-browse-recording">&#128193; Browse&#8230;</button>
            <input type="text" id="analyze-path" placeholder="or paste a file path">
          </div>
          <button class="btn ghost" id="btn-show-import-url" type="button"
                  style="margin-top:6px;font-size:12px;padding:2px 8px">&#128279; Import from a URL instead (Twitch/YouTube)</button>
        </div>

        <div class="field" id="import-url-field" style="display:none">
          <label for="import-url-input">Twitch VOD / YouTube URL</label>
          <div class="path-row">
            <input type="text" id="import-url-input" placeholder="https://www.twitch.tv/videos/... or https://youtube.com/watch?v=...">
            <button class="btn" id="btn-check-url" data-job-blocked type="button">Check link</button>
          </div>
          <button class="btn ghost" id="btn-use-local-file" type="button" style="margin-top:6px;font-size:12px;padding:2px 8px">&#8592; Use a local file instead</button>
          <div id="import-url-inspect-area" style="margin-top:8px"></div>
        </div>

        <div class="field">
          <label for="analyze-profile">Track layout</label>
          <div style="display:flex;gap:6px">
            <select id="analyze-profile" style="flex:1"></select>
            <button class="btn" id="btn-open-profile-manager" title="Manage track layouts">&#9881;</button>
          </div>
        </div>

        <div class="field" id="analyze-context-field">
          <label>World Contexts <span style="color:var(--muted);font-weight:400">(optional)</span></label>
          <div id="analyze-context-list"
               style="display:flex;flex-direction:column;gap:5px;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;max-height:120px;overflow-y:auto"></div>
        </div>

        <details class="advanced">
          <summary>Advanced options</summary>
          <div class="field">
            <label for="analyze-model">Speech-to-text model</label>
            <select id="analyze-model">
              <option value="tiny">tiny - fastest, lowest quality (~75 MB download)</option>
              <option value="base" selected>base - fast, lower quality (~140 MB download)</option>
              <option value="small">small - fast, decent quality (~465 MB download, needs a ~1 GB graphics card)</option>
              <option value="medium">medium - good balance (~1.5 GB download, needs a ~2.8 GB graphics card)</option>
              <option value="large-v3">large-v3 - best quality (~2.9 GB download, needs a ~4.2 GB graphics card)</option>
            </select>
          </div>
          <div class="field" id="analyze-diarize-field">
            <label>Speaker labels</label>
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text);margin:0">
              <input type="checkbox" id="analyze-diarize" style="width:auto">
              <span>Identifies who is speaking</span>
            </label>
            <div id="analyze-diarize-note" style="font-size:11px;color:var(--muted);margin-top:4px"></div>
          </div>
          <div class="field">
            <label for="analyze-scene-mode">Scene cut detection</label>
            <select id="analyze-scene-mode">
              <option value="transcript">Transcript only - silence gaps, instant</option>
              <option value="fast" selected>Fast - keyframes + transcript gaps (recommended)</option>
              <option value="full">Full - every frame, most accurate (slow)</option>
            </select>
          </div>
          <div class="field">
            <label for="analyze-energy-mode">Audio energy</label>
            <select id="analyze-energy-mode">
              <option value="none">None - skip (fastest)</option>
              <option value="fast" selected>Fast - lower-detail scan (recommended)</option>
              <option value="full">Full - full-detail scan (most accurate)</option>
            </select>
          </div>
        </details>

        <div id="estimate-area"></div>

        <div id="pre-split-section" style="display:none">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;padding:4px 0">
            <input type="checkbox" id="pre-split-toggle">
            Split before analyzing
          </label>
          <div id="pre-split-editor" style="display:none;flex-direction:column;gap:8px;margin-top:6px">
            <div id="pre-split-instructions" style="font-size:12px;color:var(--muted)"></div>
            <div id="pre-split-timeline-bar"
                 style="position:relative;height:48px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:6px;cursor:crosshair;overflow:hidden">
              <div id="pre-split-segments-layer" style="display:flex;height:100%;pointer-events:none"></div>
              <div id="pre-split-markers-layer" style="position:absolute;inset:0;pointer-events:none"></div>
            </div>
            <div id="pre-split-segment-list" style="display:flex;flex-direction:column;gap:6px"></div>
          </div>
        </div>

        <div id="prereq-banner" style="display:none;font-size:12px;color:var(--warning);padding:6px 0 2px"></div>

        <div class="new-recording-actions">
          <button class="btn highlight" id="btn-start-analyze" disabled
                  title="Select a valid recording file first">Start Analysis</button>
        </div>
      </div>
    </div>

    <!-- Progress log - inside .main so the sidebar extends full height beside it -->
    <div class="log-panel" id="log-panel">
      <div class="resize-handle resize-handle-v" id="log-resize-handle" title="Drag to resize log" role="separator" aria-orientation="horizontal" aria-label="Resize log panel"></div>
      <div class="log-header">
        <button id="btn-log-toggle" aria-expanded="false" aria-controls="log-body" style="flex:1;display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:inherit;padding:0;font:inherit;min-width:0">
          <span class="log-title">Log</span>
          <span class="log-toggle" id="log-toggle">&#9660;</span>
        </button>
        <button class="btn ghost" id="btn-clear-log" aria-label="Clear log" style="font-size:11px;padding:2px 8px">Clear</button>
      </div>
      <div class="log-body" id="log-body">
        <div id="log-lines"></div>
      </div>
    </div>

    <!-- Panel navigation takeover (breadcrumb + stacked panel content) - replaces
         this pane's content for multi-step flows like the Split Editor. See panelnav.js.
         Lives inside .main (position:relative) so inset:0 resolves against the detail
         pane, not the whole viewport - previously a direct <body> child with no
         positioned ancestor, so it covered the header, job-status strip (incl. Cancel),
         and sidebar too (found 2026-07-28, via a design-review pass on the export flow). -->
    <div id="panelnav-root" style="display:none;position:absolute;inset:0;min-height:480px;background:var(--bg);z-index:10;flex-direction:column;overflow-y:auto">
      <div id="panelnav-breadcrumb" style="display:flex;align-items:center;gap:10px;padding:20px 24px 0;flex-shrink:0"></div>
      <div id="panelnav-content" style="padding:16px 24px 20px"></div>
    </div>
  </div>
