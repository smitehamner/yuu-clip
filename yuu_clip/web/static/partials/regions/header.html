<header>
  <div class="brand">
    <img class="brand-logo" src="/static/gamercat.png" alt="" width="26" height="26">
    <h1>YuuClip</h1>
  </div>
  <div class="hamburger-wrap" id="project-switcher-wrap">
    <button class="btn ghost" id="btn-project-switcher"
            title="Switch project" aria-haspopup="true" aria-expanded="false"
            style="display:none;gap:6px;max-width:220px">
      <span aria-hidden="true">&#128193;</span>
      <span id="project-current-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      <span aria-hidden="true" style="font-size:9px;opacity:.7">&#9660;</span>
    </button>
    <div class="hamburger-menu" id="project-menu" role="menu" aria-label="Switch project" style="left:0;right:auto;min-width:240px;max-width:360px"></div>
  </div>
  <nav class="primary-nav" aria-label="Primary">
    <button class="nav-link" id="btn-people">People</button>
    <button class="nav-link" id="btn-world-contexts">World Contexts</button>
    <button class="nav-link" id="btn-highlight-reels">Highlight Reels</button>
  </nav>
  <div class="header-spacer" id="header-spacer"></div>
  <div id="update-banner" style="display:none;align-items:center;gap:4px">
    <a class="btn ghost" id="update-banner-link" href="#" target="_blank" rel="noopener" style="font-size:12px;padding:4px 8px"></a>
    <button class="btn ghost" id="update-banner-dismiss" aria-label="Dismiss update notice" style="font-size:12px;padding:4px 6px">&#x2715;</button>
  </div>
  <button class="gpu-warning-chip" id="gpu-warning-chip" style="display:none" title="" aria-label="Setup warning - click for details">&#9888; Setup warning</button>
  <button class="btn highlight" id="btn-analyze">+ New Recording</button>
  <button class="btn ghost" id="btn-settings-header" title="Settings" aria-label="Settings" style="font-size:15px;padding:5px 10px">&#9881;</button>
  <div class="hamburger-wrap" id="hamburger-wrap">
    <button class="btn ghost" id="btn-hamburger" title="More options" aria-label="More options" aria-haspopup="true" aria-expanded="false" style="font-size:17px;padding:5px 11px;line-height:1">&#9776;</button>
    <div class="hamburger-menu" id="hamburger-menu">
      <!-- closeHamburger() runs first: it hands focus back to the trigger, so
           the modal being opened records the trigger as its return-focus target
           instead of a menu item that is about to be display:none'd. -->
      <button class="hamburger-item" id="hamburger-item-getting-started"><span class="hamburger-icon" aria-hidden="true">&#128214;</span>Getting Started</button>
      <button class="hamburger-item" id="hamburger-item-controls"><span class="hamburger-icon" aria-hidden="true">&#9000;</span>Controls</button>
      <div class="hamburger-divider"></div>
      <button class="hamburger-item" id="hamburger-item-glossary"><span class="hamburger-icon" aria-hidden="true">&#128218;</span>Glossary</button>
      <button class="hamburger-item" id="hamburger-item-help"><span class="hamburger-icon" aria-hidden="true">&#10067;</span>Help &amp; Guides</button>
      <div class="hamburger-divider"></div>
      <a class="hamburger-item" id="hamburger-item-download-log" href="/api/logs/export" download="yuu-clip.log"><span class="hamburger-icon" aria-hidden="true">&#8595;</span>Download Log</a>
      <button class="hamburger-item" id="hamburger-item-about"><span class="hamburger-icon" aria-hidden="true">&#9432;</span>About</button>
      <button class="hamburger-item" id="btn-setup-wizard" onclick="closeHamburger();window.electronAPI.runSetupWizard()" style="display:none"><span class="hamburger-icon" aria-hidden="true">&#128295;</span>Re-run Setup Wizard</button>
      <button class="hamburger-item" id="btn-refresh" onclick="closeHamburger();location.reload()" style="display:none"><span class="hamburger-icon" aria-hidden="true">&#8635;</span>Refresh</button>
    </div>
  </div>
</header>
