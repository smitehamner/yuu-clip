<div class="modal-bg" id="field-edit-modal">
  <div class="modal" style="width:540px">
    <h3 id="field-edit-title">Edit Field</h3>
    <textarea id="field-edit-text" aria-labelledby="field-edit-title" style="width:100%;min-height:100px;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:inherit;resize:vertical;box-sizing:border-box" rows="5"></textarea>
    <div class="modal-actions">
      <button class="btn" id="field-edit-cancel-btn">Cancel</button>
      <button class="btn primary" id="field-edit-save-btn">Save</button>
    </div>
  </div>
</div>
