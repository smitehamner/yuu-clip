<div class="modal-bg" id="controls-modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header-row">
      <h3 style="margin:0">Keyboard Controls</h3>
      <button class="btn ghost modal-close-btn" id="controls-modal-close-btn" aria-label="Close">&#x2715;</button>
    </div>
    <table style="width:100%;font-size:12px;border-collapse:collapse;color:var(--muted)">
      <tbody>
        <tr><td style="padding:4px 0"><kbd>A</kbd></td><td>Approve selected clip</td></tr>
        <tr><td><kbd>R</kbd></td><td>Reject selected clip</td></tr>
        <tr><td><kbd>U</kbd></td><td>Mark selected clip unreviewed</td></tr>
        <tr><td><kbd>Space</kbd></td><td>Play / Pause video</td></tr>
        <tr><td><kbd>E</kbd></td><td>Export selected clip</td></tr>
        <tr><td><kbd>&#8592; &#8593;</kbd> / <kbd>K</kbd></td><td>Previous clip</td></tr>
        <tr><td><kbd>&#8594; &#8595;</kbd> / <kbd>J</kbd></td><td>Next clip</td></tr>
        <tr><td><kbd>Ctrl+Z</kbd></td><td>Undo last status change</td></tr>
        <tr><td><kbd>?</kbd> or <kbd>/</kbd></td><td>Open this panel</td></tr>
        <tr><td><kbd>Esc</kbd></td><td>Close the topmost window</td></tr>
      </tbody>
    </table>
  </div>
</div>
