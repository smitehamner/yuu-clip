<div class="modal-bg" id="score-override-modal">
  <div class="modal" style="width:320px">
    <h3 style="margin-top:0">Set Score Override</h3>
    <div style="margin:12px 0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <label for="score-override-slider" style="font-size:13px;color:var(--muted)">Score</label>
        <span id="score-override-display" style="font-size:24px;font-weight:700;color:var(--text);font-family:monospace">50%</span>
      </div>
      <input type="range" id="score-override-slider" min="0" max="1" step="0.01" value="0.5"
             style="width:100%;accent-color:var(--accent)"
             oninput="document.getElementById('score-override-display').textContent=Math.round(parseFloat(this.value)*100)+'%'">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px">
        <span>0%</span><span>100%</span>
      </div>
      <div id="score-override-llm-note" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="score-override-cancel-btn">Cancel</button>
      <button class="btn primary" id="score-override-save-btn">Set Override</button>
    </div>
  </div>
</div>
