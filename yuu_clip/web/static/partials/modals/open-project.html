<div class="modal-bg" id="open-project-modal">
  <div class="modal" style="width:520px">
    <h3 style="margin-top:0">Open another project</h3>
    <p style="color:var(--muted);font-size:13px;line-height:1.5;margin-top:-4px">
      Choose a project folder. A new folder becomes a fresh, empty project.
    </p>
    <button class="btn primary" id="btn-project-browse-primary" style="display:none;width:100%;margin-bottom:10px">Browse for a folder&hellip;</button>
    <div style="display:flex;gap:8px;align-items:center">
      <input type="text" id="open-project-path" placeholder="C:\Users\you\Videos\my-project"
             style="flex:1;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:inherit;box-sizing:border-box">
      <button class="btn" id="btn-project-browse" style="display:none;white-space:nowrap">Browse&hellip;</button>
    </div>
    <div id="open-project-path-label" style="display:none;font-size:11px;color:var(--muted);margin-top:4px">Picked folder - edit to type a different path instead</div>
    <div class="modal-actions">
      <button class="btn" id="btn-open-project-cancel">Cancel</button>
      <button class="btn primary" id="btn-open-project-confirm">Open</button>
    </div>
  </div>
</div>
