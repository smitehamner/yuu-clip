<div class="modal-bg" id="similar-clips-modal">
  <div class="modal" style="width:420px">
    <h3>Find Similar Clips</h3>
    <p style="font-size:12px;color:var(--muted);margin-top:-6px">Search for clips with similar themes or moments.</p>
    <div class="field">
      <label style="font-weight:600;font-size:12px">Search scope</label>
      <div id="similar-clips-scope" style="display:flex;flex-direction:column;gap:6px;margin-top:6px;max-height:200px;overflow-y:auto"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="similar-clips-cancel-btn">Cancel</button>
      <button class="btn primary" id="btn-find-similar-go">Find Similar</button>
    </div>
  </div>
</div>
