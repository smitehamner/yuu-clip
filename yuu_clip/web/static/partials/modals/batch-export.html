<div class="modal-bg" id="batch-export-modal">
  <div class="modal" style="width:400px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <h3 style="margin:0">Export Approved Clips</h3>
      <button class="btn ghost" style="padding:4px 8px" id="batch-export-x-btn" aria-label="Close">&#x2715;</button>
    </div>
    <div class="field">
      <label for="batch-min-score">Minimum score</label>
      <div style="display:flex;align-items:center;gap:10px">
        <input type="range" id="batch-min-score" min="0" max="1" step="0.05" value="0">
        <span id="batch-min-score-val" style="font-size:13px;font-weight:600;min-width:36px">0%</span>
      </div>
    </div>
    <div id="batch-estimate-line" style="font-size:12px;color:var(--muted);margin-bottom:10px"></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-bottom:10px">
      <input type="checkbox" id="batch-skip-exported" checked>
      Skip clips already exported
    </label>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <label for="batch-container" style="font-size:13px;color:var(--muted);min-width:110px">Output format</label>
      <select id="batch-container" style="flex:1;min-width:0;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">
        <option value="">Match source</option>
        <option value="mkv">MKV</option>
        <option value="mp4">MP4</option>
      </select>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <label for="batch-captions" style="font-size:13px;color:var(--muted);min-width:110px">Captions</label>
      <select id="batch-captions" style="flex:1;min-width:0;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">
        <option value="none">None</option>
        <option value="softsub" selected>Embed captions - toggle on/off in your player (fast, no re-encode)</option>
        <option value="hardsub">Burn in captions - can't turn off later (slower, re-encodes)</option>
      </select>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-bottom:8px">
      <input type="checkbox" id="batch-retranscribe">
      Retranscribe before export
    </label>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <label for="batch-retranscribe-model" style="font-size:13px;color:var(--muted);min-width:110px">Speech-to-text model</label>
      <select id="batch-retranscribe-model" disabled style="flex:1;min-width:0;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">
        <option value="tiny">tiny - fastest, lowest quality (~75 MB download)</option>
        <option value="base">base - fast, lower quality (~140 MB download)</option>
        <option value="small">small - fast, decent quality (~465 MB download, needs a ~1 GB graphics card)</option>
        <option value="medium">medium - good balance (~1.5 GB download, needs a ~2.8 GB graphics card)</option>
        <option value="large-v3">large-v3 - best quality (~2.9 GB download, needs a ~4.2 GB graphics card)</option>
      </select>
    </div>
    <div id="batch-mode-summary" style="font-size:12px;border-top:1px solid var(--border);padding-top:10px;margin-bottom:14px"></div>
    <div class="modal-actions">
      <button class="btn" id="batch-cancel-btn">Cancel</button>
      <button class="btn highlight" id="batch-confirm-btn" data-job-blocked>Export</button>
    </div>
  </div>
</div>
