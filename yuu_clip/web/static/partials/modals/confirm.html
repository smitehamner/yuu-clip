<div class="modal-bg" id="confirm-modal">
  <div class="modal" style="width:420px">
    <h3 id="confirm-title"></h3>
    <p id="confirm-body" style="color:var(--muted);font-size:13px;line-height:1.6;margin-top:-4px"></p>
    <div class="modal-actions">
      <button class="btn" id="confirm-cancel-btn">Cancel</button>
      <button class="btn" id="confirm-ok-btn">Confirm</button>
    </div>
  </div>
</div>
