<div class="modal-bg" id="reel-preview-modal">
  <div class="modal" style="width:720px;padding:14px" aria-label="Clip preview">
    <div class="modal-header-row">
      <span id="reel-preview-label" style="font-size:13px;color:var(--muted)"></span>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="btn ghost" id="reel-preview-prev" style="font-size:11px;padding:4px 10px" title="Previous clip">&#9664; Previous</button>
        <button class="btn ghost" id="reel-preview-next" style="font-size:11px;padding:4px 10px" title="Next clip">Next &#9654;</button>
        <button class="btn ghost modal-close-btn" id="reel-preview-close-btn" aria-label="Close">&#x2715;</button>
      </div>
    </div>
    <video id="reel-preview-video" controls style="width:100%;border-radius:6px;background:#000;max-height:72vh"></video>
  </div>
</div>
