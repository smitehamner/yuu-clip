    "sqlalchemy>=2.0,<3.0",

    # Cross-platform config/data dirs (AppData on Windows, ~/.config on Linux).
    "platformdirs>=4.0,<6.0",

    # Phase 2: scene cut detection. [opencv-headless] avoids pulling in
    # a GUI-linked OpenCV build, which is unnecessary on a headless server.
    "scenedetect[opencv-headless]>=0.6,<1.0",

    # Phase 2: local LLM scoring via Ollama HTTP client.
    "ollama>=0.3,<1.0",

    # Phase 3: web UI backend and ASGI server.
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",

    # Fuzzy string matching for sensitive-content "Close spelling" mode (MIT licensed).
    "rapidfuzz>=3.0,<4.0",

    # Optional: GPU thermal monitoring (Settings -> Hardware). Silently disables
    # (available()==False) when no NVIDIA GPU / driver is present -- see analyze/thermal.py.
    "pynvml>=11.5,<13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<3.0",
    "pytest-xdist>=3.5,<4.0",
    "playwright>=1.40,<2.0",
    "pytest-playwright>=0.5,<1.0",
    "ruff>=0.4,<2.0",
]
llamacpp = [
    "llama-cpp-python>=0.3,<1.0",
]
laugh-model = [
    # Required for scorer_laugh_mode = "model".
    # Recommended model: MIT/ast-finetuned-audioset-10-10-0.4593 (~350 MB, auto-downloads)
    "transformers>=4.30,<6.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "soundfile>=0.12",
]

[project.scripts]
yuuclip = "yuu_clip.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["yuu_clip*"]

[tool.setuptools.package-data]
yuu_clip = ["web/static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
