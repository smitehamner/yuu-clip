[build-system]
requires = ["setuptools>=40"]
build-backend = "setuptools.build_meta"

[project]
name = "yuu-clip"
version = "0.1.26"
description = "Video session clip extraction pipeline"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.14"
dependencies = [
    # Transcription - GPU-accelerated Whisper via CTranslate2.
    # av (PyAV) is a required dep of faster-whisper and is also used
    # directly in energy.py / overlap.py for audio frame decoding.
    "faster-whisper>=1.2,<2.0",

    # CLI framework. rich (pretty output) + shellingham are core deps since 0.12,
    # so the old [all] extra is gone - plain typer already pulls them.
    "typer>=0.12,<1.0",

    # ORM - SQLite database for clips, transcripts, scores.
    "sqlalchemy>=2.0,<3.0",

    # Cross-platform config/data dirs (AppData on Windows, ~/.config on Linux).
    "platformdirs>=4.0,<6.0",

    # Phase 2: scene cut detection. Pulls opencv-python transitively (scenedetect
    # 0.7 dropped the [opencv-headless] extra and depends on the full build). Fine
    # here: yuu-clip is a desktop app with a display, not a headless server.
    "scenedetect>=0.6,<1.0",

    # Phase 3: web UI backend and ASGI server.
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",

    # Fuzzy string matching for sensitive-content "Close spelling" mode (MIT licensed).
    "rapidfuzz>=3.0,<4.0",

    # Optional: GPU thermal monitoring (Settings -> Hardware). Silently disables
    # (available()==False) when no NVIDIA GPU / driver is present -- see analyze/thermal.py.
    "pynvml>=11.5,<13.0",

    # URL import (Twitch VOD / YouTube downloads). Unlicense (public domain) -- fine
    # for the licensing policy. See web/routes/imports.py and imports_dl.py.
    "yt-dlp>=2025.1,<2027.0",

    # ---- Tier A: default-feature packages, bundled in the box ----
    # packaging-strategy-overhaul Wave 1 moved these out of the old optional
    # extras (embeddings / audio-model) and per-feature installs into the base
    # set so a fresh install has zero "install this too" prompts. See
    # docs/dev/PACKAGING-TIERS.md. All are permissively licensed; the models they
    # pull at first use are licence-cleared (Wave 0 verdicts in that doc). Every
    # one resolves to a cp312 win_amd64 wheel for the offline wheelhouse.
    #
    # Speaker labels (diarization_backend = "speechbrain"): ECAPA-TDNN via
    # SpeechBrain (Apache-2.0). scikit-learn does the speaker clustering.
    "speechbrain>=1.0,<2.0",
    "scikit-learn>=1.3,<2.0",

    # Laugh / audio-event scoring: HuggingFace AST classifier
    # (MIT/ast-finetuned-audioset-10-10-0.4593, BSD-3-Clause -- "MIT" is the HF
    # org namespace, not the licence). transformers runs it; torch/torchaudio are
    # its backend; soundfile decodes audio. CPU torch/torchaudio are the base
    # build -- GPU (CUDA) wheels stay Tier C (opt-in, force-reinstalled).
    "transformers>=4.30,<6.0",
    "torch>=2.0,<3.0",
    "torchaudio>=2.0,<3.0",
    "soundfile>=0.12,<1.0",

    # Better similarity (similarity_backend = "embeddings"): fastembed runs
    # BAAI/bge-small-en-v1.5 (MIT) on onnxruntime -- no PyTorch. Replaces tfidf.
    "fastembed>=0.3,<1.0",

    # Vertical auto-framing: mediapipe face detection for reframing exports.
    # Apache-2.0. cp312 win_amd64 wheel confirmed (0.10.35).
    "mediapipe>=0.10,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<3.0",
    "pytest-xdist>=3.5,<4.0",
    "pytest-timeout>=2.1,<3.0",
    "playwright>=1.40,<2.0",
    "pytest-playwright>=0.5,<1.0",
    "ruff>=0.4,<2.0",
    "mypy>=1.8,<2.0",
    "mypy-baseline>=0.7,<1.0",
]
# The local LLM/vision backend no longer uses the in-process llama-cpp-python wheel
# (CPU-only, and its AVX512 prebuilt wheels crashed on many consumer CPUs). It now
# drives upstream's bundled Vulkan llama-server over HTTP - see the
# bundled-vulkan-llamacpp plan. Kept as an empty no-op alias so an older
# `pip install yuu-clip[llamacpp]` still resolves.
llamacpp = []
# These features' packages are now bundled in the base dependencies (Tier A,
# packaging-strategy-overhaul Wave 1). The extras remain as empty no-op aliases so
# any older `pip install yuu-clip[embeddings|audio-model|laugh-model]` invocation
# still resolves without pinning the packages a second time.
embeddings = []
audio-model = []
laugh-model = []

[project.scripts]
yuuclip = "yuu_clip.cli:app"
yuu-dev = "yuu_clip.dev:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["yuu_clip*"]

[tool.setuptools.package-data]
# setuptools globs do NOT recurse, so each static subdirectory must be listed
# explicitly - `web/static/*` alone misses web/static/help/ and web/static/fonts/.
yuu_clip = ["web/static/*", "web/static/fonts/*", "web/static/help/*", "web/static/shared/*"]

[tool.mypy]
# Lenient global baseline - the codebase is largely untyped and we do NOT do a
# big-bang annotation pass. Existing errors are frozen in a committed baseline
# (mypy-baseline.txt); `yuu-dev typecheck` fails only on NEW errors (a regression or
# an error in code you just touched). Annotate as-you-touch: when editing a function,
# add types and clear any baseline entry it resolves. See CLAUDE.md.
python_version = "3.12"
# yuu-clip ships Windows-only (bundled python.exe / .exe runtimes), so pin mypy's
# platform to win32 regardless of the host OS. Without this, the CI runner (Linux)
# analyzes win32-only stdlib (ctypes.WinDLL, etc.) as missing and reports errors the
# Windows-generated baseline can't contain - the baseline must be produced under the
# same platform mypy checks under. Regenerate the baseline with `yuu-dev typecheck
# --sync` (also win32 via this setting).
platform = "win32"
files = ["yuu_clip"]
ignore_missing_imports = true
# mypy-baseline matches on message text, not line numbers, so these help it stay
# stable across refactors.
show_error_codes = true
show_column_numbers = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long - tighten incrementally
]
