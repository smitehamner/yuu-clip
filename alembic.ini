# Alembic config for manual/dev use of the bare `alembic` CLI.
#
# The app and `yuu-dev migrate*` do NOT read this file - they build the Config
# programmatically (yuu_clip/db/migrate.py) so the packaged app needs no repo root
# and always targets the real project DB. This file only exists so a developer can
# run `alembic ...` by hand; set sqlalchemy.url to a project's DB first, e.g.
#   sqlite:///./.yuu-clip/project.db
[alembic]
script_location = yuu_clip/db/migrations
sqlalchemy.url = sqlite:///./.yuu-clip/project.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
