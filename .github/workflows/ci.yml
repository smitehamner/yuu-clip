name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check yuu_clip tests

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A few pipeline/export paths shell out to ffmpeg, so it must be on PATH.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The dev extras pull the full ML stack (torch, transformers, speechbrain,
      # mediapipe, ...), so this step is heavy on a cold cache. pip caching (above)
      # amortizes it across runs.
      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit + integration tests
        run: python -m yuu_clip.dev test-api
