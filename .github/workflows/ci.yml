name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      - run: ruff check yuu_clip tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # mypy analyzes the yuu_clip sources directly (ignore_missing_imports), so the
      # heavy [dev] ML stack is not needed here. Pin to the pyproject range so a new
      # mypy release cannot turn main red on its own (its new checks would be "new"
      # errors vs the committed baseline).
      - run: pip install "mypy>=1.8,<2.0" "mypy-baseline>=0.7,<1.0"
      - name: Type check (fail only on new errors vs mypy-baseline.txt)
        # mypy exits non-zero whenever it finds any error (all baselined ones
        # included), so tolerate its exit and let mypy-baseline be the gate: it drops
        # every known error and exits non-zero only on a new one.
        run: |
          python -m mypy > mypy.out || true
          python -m mypy_baseline filter < mypy.out

  # One Python job per test tier (separate status checks, run in parallel). Each tier
  # is its own `yuu-dev` command; fail-fast is off so one red tier does not mask the
  # others. All three share the same heavy [dev] install (the pip cache amortizes it)
  # because the unit tier still imports yuu_clip modules that pull the ML stack, and
  # the integration/system tiers exercise the real pipeline. The ui (Playwright) tier
  # stays out of CI - it needs a live server + seeded project - and test-golden stays
  # out too: it is env-gated on real Whisper + a local .gguf and would only ever skip.
  pytest:
    name: pytest (${{ matrix.tier }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [unit, integration, system]
    steps:
      - uses: actions/checkout@v4
      # The integration and system tiers shell out to ffmpeg (cut/encode, the
      # generated system-tier fixture video); installing it for the unit tier too
      # keeps the matrix uniform at negligible cost.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Hash both files so a base-dep pin (lock) or a dev-extra change
          # (pyproject) invalidates the wheel cache.
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      # The dev extras pull the full ML stack (torch, transformers, speechbrain,
      # mediapipe, ...), so this step is heavy on a cold cache. pip caching (above)
      # amortizes it across runs. The lock constraint pins the heavy base deps to
      # the exact versions we test, so a new transitive release can't turn main red
      # on its own (dev-only tools stay unpinned - the lock covers base deps only).
      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c requirements.lock
      - name: ${{ matrix.tier }} tier
        run: python -m yuu_clip.dev test-${{ matrix.tier }}

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # The JS unit tier that `yuu-dev test-js` wraps (vitest + happy-dom over
      # tests/js/). Node-only, sub-minute - no Python env needed to run it.
      - name: JS unit tests (vitest)
        run: npm run test:js

  test-electron:
    # The Electron wrapper is a Windows-only layer: constants.js resolves Windows
    # env vars (LOCALAPPDATA/APPDATA/USERPROFILE) and .exe paths at module load, so
    # its node --test suite must run on Windows - on Linux those env vars are unset
    # and every test crashes at import. This mirrors the app's only target OS.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Pure-unit (sub-second); no install needed - the tests require only node
      # builtins + committed source. The opt-in boot smoke test (YUU_SMOKE=1) stays
      # off here: it needs a real Electron + a python that can import yuu_clip.
      - name: Electron wrapper unit tests (node --test)
        run: npm test
        working-directory: electron
