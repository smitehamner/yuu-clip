name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      - run: ruff check yuu_clip tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # mypy analyzes the yuu_clip sources directly (ignore_missing_imports), so the
      # heavy [dev] ML stack is not needed here. Pin to the pyproject range so a new
      # mypy release cannot turn main red on its own (its new checks would be "new"
      # errors vs the committed baseline).
      - run: pip install "mypy>=1.8,<2.0" "mypy-baseline>=0.7,<1.0"
      - name: Type check (fail only on new errors vs mypy-baseline.txt)
        # mypy exits non-zero whenever it finds any error (all baselined ones
        # included), so tolerate its exit and let mypy-baseline be the gate: it drops
        # every known error and exits non-zero only on a new one.
        run: |
          python -m mypy > mypy.out || true
          python -m mypy_baseline filter < mypy.out

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A few pipeline/export paths shell out to ffmpeg, so it must be on PATH.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Hash both files so a base-dep pin (lock) or a dev-extra change
          # (pyproject) invalidates the wheel cache.
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      # The dev extras pull the full ML stack (torch, transformers, speechbrain,
      # mediapipe, ...), so this step is heavy on a cold cache. pip caching (above)
      # amortizes it across runs. The lock constraint pins the heavy base deps to
      # the exact versions we test, so a new transitive release can't turn main red
      # on its own (dev-only tools stay unpinned - the lock covers base deps only).
      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c requirements.lock
      - name: Unit + integration tests
        run: python -m yuu_clip.dev test-api
